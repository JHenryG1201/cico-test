name: CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set Up SSH Key
      shell: bash
      run: |
        echo "${{ secrets.EC2_KEY }}" > ~/my-test-key.pem
        chmod 400 ~/my-test-key.pem
    
    - name: Deploy Code
      shell: bash
      run: |
        rsync -avz --delete \
        -e "ssh -o StrictHostKeyChecking=no -i ~/my-test-key.pem" \
        ./myapp/ \
        ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/test/

        ssh -o StrictHostKeyChecking=no \
        -i ~/my-test-key.pem \
        ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
        cd /home/${{ secrets.EC2_USER }}/test &&
        docker compose up --build -d
        "
